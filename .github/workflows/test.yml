name: test

on:
  push:
  pull_request:

jobs:
  package-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm test
      - name: Clean package import smoke test with pnpm
        shell: bash
        run: |
          set -euo pipefail
          pkg="$(npm pack --silent | tail -n1)"
          tmp="$(mktemp -d)"
          cd "$tmp"
          printf '{"private":true}\n' > package.json
          npx -y pnpm@12.11.2 add "$GITHUB_WORKSPACE/$pkg"
          npx -y pnpm@12.11.2 list --depth 2
          node --input-type=module -e "import('dsh-openai-oauth').then(m => console.log('PLUGIN LOAD OK:', Object.keys(m)))"

  dsh-0-2-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Verify pinned DSH LLM runtime
        run: node -e "const p=require('@deepseek-ai/dsh-llm/package.json'); if(p.version!=='0.2.0-rc.2') throw new Error('unexpected dsh-llm '+p.version); console.log(p.version)"
      - name: Type-check and emit against DSH 0.2.0-rc.2
        run: npx tsc -p tsconfig.json
      - name: Run adapter regression tests on DSH 0.2.0-rc.2
        run: node --test tests/adapter.test.mjs
